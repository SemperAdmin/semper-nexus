# Deploy to cloud.gov, on Linux.
#
# Modeled on SemperAdmin/semperscribe's deploy-cloudgov.yml. Same shape for
# every Semper Admin app: build, prove the bundle, push with a space-deployer
# service account, smoke-test the live route.
#
# The single most likely failure on this path is a base-path mismatch.
# deploy-github-pages.yml builds with the /semper-nexus/ base for Pages; on
# cloud.gov the app is served at the route root, so this workflow builds
# with --base=/ and then proves it by inspecting dist/index.html.
#
# workflow_dispatch only, not a push trigger: a deploy to a government
# sandbox is an explicit act, not a side effect of merging to main (that is
# what deploy-github-pages.yml is for).
#
# CREDENTIALS. CF_USERNAME / CF_PASSWORD are a cloud.gov space-deployer
# service account, never an SSO user (service accounts have no MFA prompt,
# so they are the only credential CI can use unattended). One account can
# serve every repo: store the pair as organization secrets on SemperAdmin,
# or per repo under Settings > Secrets and variables > Actions. To mint one:
#   cf create-service cloud-gov-service-account space-deployer <name>
#   cf create-service-key <name> github-actions
#   cf service-key <name> github-actions
# The sandbox purge (90 days) deletes the account; mint again afterwards.
name: Deploy to cloud.gov

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudgov
  cancel-in-progress: false

env:
  CF_API: https://api.fr.cloud.gov
  CF_ORG: sandbox-usmc
  CF_SPACE: stephen.shorter
  APP_ROUTE: https://nexus.app.cloud.gov/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudgov
      url: https://nexus.app.cloud.gov/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same gate security-audit.yml runs weekly; here it blocks the push.
      - name: Security audit (fail on high or critical)
        run: npm audit --audit-level=high

      # Static data fetch scripts do not run in Actions (network
      # restrictions); the build uses the committed lib/*.js files, same as
      # the Pages workflow.
      - name: Build for the route root
        run: npx vite build --base=/

      - name: Stage Staticfile
        run: cp deploy/Staticfile dist/Staticfile

      - name: Prove the bundle
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing after build"; exit 1; }
          if grep -q '/semper-nexus/' dist/index.html; then
            echo "::error::dist/index.html references /semper-nexus/. This is a GitHub Pages build; every asset would 404 on cloud.gov."
            exit 1
          fi
          test -f dist/Staticfile || { echo "::error::dist/Staticfile missing"; exit 1; }

      # Official apt repo, no third-party action: one less supply-chain hop
      # ahead of the step that hands this runner production credentials.
      - name: Install cf CLI
        run: |
          curl -fsSL https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --dearmor -o /usr/share/keyrings/cloudfoundry-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudfoundry-keyring.gpg] https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry.list
          sudo apt-get update && sudo apt-get install --yes cf8-cli
          cf version

      - name: Push
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api "$CF_API"
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"
          cf push

      - name: Post-deploy smoke
        run: |
          code=$(curl -sS -o /tmp/live.html -w '%{http_code}' "$APP_ROUTE")
          [ "$code" = "200" ] || { echo "::error::$APP_ROUTE returned HTTP $code"; exit 1; }
          grep -qi '<html' /tmp/live.html || { echo "::error::$APP_ROUTE body carries no <html>"; exit 1; }
          if grep -q '/semper-nexus/' /tmp/live.html; then echo "::error::Live page references /semper-nexus/; wrong base path shipped"; exit 1; fi
          curl -sSI "$APP_ROUTE" | grep -qi '^strict-transport-security:' || echo "::warning::No Strict-Transport-Security header on $APP_ROUTE"
